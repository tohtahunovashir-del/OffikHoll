name: iOS Build

on:
  push:
    branches:
      - main
      - 'arena/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned OffikHoll.app
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml --project .

      - name: Restore Swift package pins
        run: |
          mkdir -p OffikHoll.xcodeproj/project.xcworkspace/xcshareddata/swiftpm
          cp Package.resolved OffikHoll.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved

      - name: Resolve Swift packages (GRDB)
        run: |
          xcodebuild -resolvePackageDependencies \
            -project OffikHoll.xcodeproj \
            -scheme OffikHoll \
            -clonedSourcePackagesDirPath .build/spm

      - name: Build without code signing
        run: |
          set -o pipefail
          xcodebuild build \
            -project OffikHoll.xcodeproj \
            -scheme OffikHoll \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath .build/DerivedData \
            -clonedSourcePackagesDirPath .build/spm \
            -quiet \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            2>&1 | tee build.log

      - name: Run unit tests
        run: |
          set -o pipefail

          DEST=""
          for CANDIDATE in "iPhone 16 Pro" "iPhone 16" "iPhone 15 Pro" "iPhone 15" "iPhone SE (3rd generation)"; do
            if xcrun simctl list devices available | grep -q "${CANDIDATE} ("; then
              DEST="platform=iOS Simulator,name=${CANDIDATE},OS=latest"
              break
            fi
          done
          if [ -z "$DEST" ]; then
            DEVICE=$(xcrun simctl list devices available | grep -m1 -oE 'iPhone [^(]+' | sed 's/ *$//')
            DEST="platform=iOS Simulator,name=${DEVICE},OS=latest"
          fi
          echo "Simulator destination: $DEST"

          # Simulator builds are signed ad-hoc by Xcode, so the device-build
          # signing overrides used above must NOT be passed here.
          xcodebuild test \
            -project OffikHoll.xcodeproj \
            -scheme OffikHoll \
            -configuration Debug \
            -destination "$DEST" \
            -derivedDataPath .build/TestDerivedData \
            -clonedSourcePackagesDirPath .build/spm \
            2>&1 | tee test.log

          grep -E "Test Suite .* (passed|failed)|Executed [0-9]+ test" test.log | tail -20 || true

      - name: Publish test summary
        if: always()
        run: |
          {
            echo ""
            echo "### Unit tests"
            echo ""
            if [ -f test.log ]; then
              echo '```'
              grep -E "Test Suite .* (passed|failed)|Executed [0-9]+ test|error:" test.log | tail -40 || echo "no test output"
              echo '```'
            else
              echo "test.log is missing"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Package unsigned .app
        if: success()
        run: |
          APP_PATH=".build/DerivedData/Build/Products/Debug-iphoneos/OffikHoll.app"
          test -d "$APP_PATH" || { echo "App not found at $APP_PATH"; find .build/DerivedData/Build/Products -maxdepth 3 -type d || true; exit 1; }
          mkdir -p artifacts
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" artifacts/OffikHoll-unsigned.app.zip
          ls -lh artifacts

      - name: Report build and test failures
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### OffikHoll CI diagnostics"
            echo ""
            echo "Commit: \`${{ github.sha }}\`"
            echo ""
            echo "#### Build"
            echo '```'
            if [ -f build.log ]; then
              grep -nE "error:|BUILD FAILED|The following build commands failed" build.log | head -60 || echo "no build errors"
            else
              echo "build.log missing"
            fi
            echo '```'
            echo ""
            echo "#### Tests"
            echo '```'
            if [ -f test.log ]; then
              grep -nE "error:|Testing failed|Test Case .* failed|XCTAssert|Executed [0-9]+ test" test.log | head -80 || echo "no matching test lines"
              echo "----- tail -----"
              tail -30 test.log
            else
              echo "test.log missing (tests never started)"
            fi
            echo '```'
            echo ""
            echo "#### Simulators"
            echo '```'
            xcrun simctl list devices available | head -20 || true
            echo '```'
          } > ci-errors.md
          jq -Rs '{body: .}' ci-errors.md > ci-errors.json
          gh api --method POST \
            "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            --input ci-errors.json || true

      - name: Collect build log
        if: always()
        run: |
          mkdir -p artifacts
          if [ -f build.log ]; then ditto -c -k build.log artifacts/build.log.zip; fi
          if [ -f test.log ]; then ditto -c -k test.log artifacts/test.log.zip; fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OffikHoll-unsigned-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

      - name: Summary
        if: always()
        run: |
          {
            echo "## OffikHoll iOS build"
            echo ""
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Xcode: $(xcodebuild -version | head -1)"
            echo "- Signing: disabled (CODE_SIGNING_ALLOWED=NO)"
            echo "- Artifacts: OffikHoll-unsigned-*.zip"
          } >> "$GITHUB_STEP_SUMMARY"
