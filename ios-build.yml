name: iOS Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build OffikHoll (unsigned)
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then brew install xcodegen; fi
          xcodegen --version

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project OffikHoll.xcodeproj -scheme OffikHoll

      - name: Build for iOS (without code signing)
        run: >-
          xcodebuild
          -project OffikHoll.xcodeproj
          -scheme OffikHoll
          -configuration Release
          -destination 'generic/platform=iOS'
          -derivedDataPath build/DerivedData
          CODE_SIGN_IDENTITY=""
          CODE_SIGNING_REQUIRED=NO
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Package app
        run: |
          cd build/DerivedData/Build/Products/Release-iphoneos
          ditto -c -k --sequesterRsrc --keepParent OffikHoll.app "$GITHUB_WORKSPACE/OffikHoll-iOS-unsigned.zip"

      - name: Upload unsigned app artifact
        uses: actions/upload-artifact@v4
        with:
          name: OffikHoll-iOS-unsigned
          path: OffikHoll-iOS-unsigned.zip
          if-no-files-found: error
          retention-days: 14
