# OffikHoll — XcodeGen project specification
# Generate the Xcode project with: xcodegen generate
name: OffikHoll

options:
  bundleIdPrefix: com.offikholl
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: false
  developmentLanguage: ru
  xcodeVersion: "15.0"

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_EMIT_LOC_STRINGS: NO
    CLANG_ENABLE_MODULES: YES

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    from: 6.29.3

targets:
  OffikHoll:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      # The main source folder. `.github` is excluded so XcodeGen never tries
      # to parse workflow YAML as source, and the asset catalog / launch
      # storyboard are listed explicitly below (this is what removes the
      # black bars around the app on launch).
      - path: OffikHoll
        excludes:
          - '.github'
          - '**/*.md'
          - 'Assets.xcassets'
          - 'LaunchScreen.storyboard'
          - 'Info.plist'
      - path: OffikHoll/Assets.xcassets
        buildPhase: resources
      - path: OffikHoll/LaunchScreen.storyboard
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.offikholl.app
        PRODUCT_NAME: OffikHoll
        INFOPLIST_FILE: OffikHoll/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - '@executable_path/Frameworks'
    dependencies:
      - package: GRDB

schemes:
  OffikHoll:
    build:
      targets:
        OffikHoll: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
